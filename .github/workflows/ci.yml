name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ── Backend: compile, test, package ──────────────────────────────────────────
  backend:
    name: Backend (Java / Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build & verify
        working-directory: fhir-server
        run: mvn --batch-mode verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: fhir-server-jar
          path: fhir-server/target/*.jar
          retention-days: 7

  # ── Frontend: type-check & build ─────────────────────────────────────────────
  frontend:
    name: Frontend (Node / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fhir-admin-ui/package-lock.json

      - name: Install dependencies
        working-directory: fhir-admin-ui
        run: npm ci

      - name: Type-check & build
        working-directory: fhir-admin-ui
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: fhir-admin-ui-dist
          path: fhir-admin-ui/dist/
          retention-days: 7

  # ── Frontend: unit tests (Vitest + RTL) ─────────────────────────────────────
  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fhir-admin-ui/package-lock.json

      - name: Install dependencies
        working-directory: fhir-admin-ui
        run: npm ci

      - name: Run unit tests
        working-directory: fhir-admin-ui
        run: npm test

  # ── Docker: validate image builds ────────────────────────────────────────────
  docker:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs: [backend, frontend, frontend-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build --no-cache

  # ── Package: archive release assets ──────────────────────────────────────────
  package:
    name: Package release assets
    runs-on: ubuntu-latest
    needs: [backend, frontend, frontend-tests]
    # Only run on version tags or manual dispatch; skip on ordinary PR/push
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fhir-admin-ui/package-lock.json

      - name: Build backend JAR
        working-directory: fhir-server
        run: mvn --batch-mode package -DskipTests

      - name: Build frontend dist
        working-directory: fhir-admin-ui
        run: npm ci && npm run build

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble release assets
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          mkdir -p dist-release

          # Backend JAR
          cp fhir-server/target/fhir-server-*.jar dist-release/fhir-platform-server-${VERSION}.jar

          # Frontend UI archive
          tar -czf dist-release/fhir-platform-ui-${VERSION}.tar.gz -C fhir-admin-ui dist

          # Installer scripts and config templates
          cp scripts/install.ps1 dist-release/
          cp scripts/install.sh  dist-release/
          cp -r config            dist-release/config

          echo "Release assets:"
          ls -lh dist-release/

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ steps.version.outputs.tag }}
          path: dist-release/
          retention-days: 30

      - name: Attach assets to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          gh release upload "${VERSION}" dist-release/* --clobber
