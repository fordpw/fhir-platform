name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ── Backend: compile, test, package ──────────────────────────────────────────
  backend:
    name: Backend (Java / Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build & verify
        working-directory: fhir-server
        run: mvn --batch-mode verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: fhir-server-jar
          path: fhir-server/target/*.jar
          retention-days: 7

  # ── Frontend: type-check & build ─────────────────────────────────────────────
  frontend:
    name: Frontend (Node / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fhir-admin-ui/package-lock.json

      - name: Install dependencies
        working-directory: fhir-admin-ui
        run: npm ci

      - name: Type-check & build
        working-directory: fhir-admin-ui
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: fhir-admin-ui-dist
          path: fhir-admin-ui/dist/
          retention-days: 7

  # ── Docker: validate image builds ────────────────────────────────────────────
  docker:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build --no-cache
