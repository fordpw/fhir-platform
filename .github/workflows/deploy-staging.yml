name: Deploy to Staging

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy (local staging)
    runs-on: [self-hosted, staging]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run staging deployment script
        shell: pwsh
        run: pwsh scripts/deploy-staging.ps1

      - name: Verify staging endpoints
        shell: pwsh
        run: |
          $fhir   = Invoke-RestMethod "http://localhost:8081/fhir/metadata"
          $login  = Invoke-RestMethod "http://localhost:8081/api/auth/login" `
                      -Method POST -ContentType "application/json" `
                      -Body '{"username":"admin","password":"admin"}'
          $stats  = Invoke-RestMethod "http://localhost:8081/api/admin/stats" `
                      -Headers @{ Authorization = "Bearer $($login.token)" }
          $fe     = Invoke-WebRequest "http://localhost:5174" -TimeoutSec 5

          Write-Host "FHIR metadata : $($fhir.resourceType) $($fhir.fhirVersion)"
          Write-Host "Login         : $($login.username) ($($login.role))"
          Write-Host "Total resources: $($stats.totalResources)"
          Write-Host "Frontend      : HTTP $($fe.StatusCode)"

          if ($fhir.fhirVersion -ne "4.0.1")  { throw "Unexpected FHIR version" }
          if ($login.role -ne "ADMIN")          { throw "Login failed" }
          if ($fe.StatusCode -ne 200)           { throw "Frontend not reachable" }

          Write-Host "All staging checks passed." -ForegroundColor Green
